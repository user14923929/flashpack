name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: ''
            name: linux-x86_64
          - os: windows-latest
            arch: win64_msvc2022_64
            name: windows-x86_64
          - os: macos-latest
            arch: ''
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: ${{ matrix.arch }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix stage/usr
          tar -C stage -czf flashpack-${{ matrix.name }}.tar.gz usr

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy build/Release/flashpack.exe dist/
          windeployqt --release dist/flashpack.exe
          Compress-Archive -Path dist/* -DestinationPath flashpack-${{ matrix.name }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/flashpack.app -dmg
          mv build/flashpack.dmg flashpack-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: flashpack-${{ matrix.name }}
          path: flashpack-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
